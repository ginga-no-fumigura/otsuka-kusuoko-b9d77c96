name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 大塚楠緒子 詩篇（『日本現代文學全集 10 樋口一葉集 附 明治女流文學』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: otsuka-kusuoko-b9d77c96-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
